- name: DEGIRO News and Company Intelligence API
  description: >
    Company intelligence endpoints providing news feeds, company profiles, financial ratios, income statements,
    balance sheets, analyst estimates, and corporate event agendas (earnings, dividends, IPOs, stock splits).
    Data is sourced via Refinitiv and vwd data partnerships integrated into the DEGIRO platform. Access
    requires a valid DEGIRO trading session.
