- name: DEGIRO Reporting API
  description: >
    Account reporting endpoint providing downloadable financial statements and transaction records in
    multiple formats including CSV, HTML, PDF, and XLS. Supports account reports, transaction history
    exports, order history, portfolio snapshots, and upcoming payment schedules. Access requires an authenticated
    session with a valid int_account identifier.
