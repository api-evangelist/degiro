- name: DEGIRO Quotecast API
  description: >
    Real-time market data streaming service providing live ticker subscriptions for price, volume, bid/ask,
    and OHLC metrics across tradable instruments. Supports chart data retrieval with multiple time resolutions
    and historical periods. Instruments are referenced by vwd_id or issueid. The Quotecast service URL
    is resolved from the trading configuration and connections reset approximately every 15 seconds, requiring
    periodic re-subscription.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.degiro.eu
  baseURL: https://charting.vwdservices.com
