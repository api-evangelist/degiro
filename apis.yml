apis:
- name: DEGIRO Product Search API
  description: >
    Endpoint suite for discovering tradable financial instruments on the DEGIRO platform. Supports full-text
    search across stocks, ETFs, bonds, options, futures, warrants, leveraged products, and investment
    funds. Allows filtering by exchange, index, and product type, and retrieval of product details including
    ISIN, currency, exchange listing, and pricing metadata. Product search URL is resolved from the trading
    configuration object returned at session creation.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.degiro.eu
  baseURL: https://trader.degiro.nl
  tags:
